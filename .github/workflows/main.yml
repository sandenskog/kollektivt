- name: Deploy to Synology via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script_stop: true
        command_timeout: 30m
        script: |
          mkdir -p /volume1/web/apps/kollektivt
          cd /volume1/web/apps/kollektivt
          if [ ! -d ".git" ]; then
            git clone https://github.com/sandenskog/kollektivt.git .
          fi
          git pull origin main
